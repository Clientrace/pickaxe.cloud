[project]
name = "pickaxe"
version = "0.1.0"
description = "Dead-simple Minecraft servers on AWS: up, wake, sleep."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
pickaxe = "pickaxe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pickaxe"]

[tool.hatch.build.targets.wheel.force-include]
"pickaxe/serverless.yml" = "pickaxe/serverless.yml"
"pickaxe/package.json" = "pickaxe/package.json"
"pickaxe/agent" = "pickaxe/agent"
